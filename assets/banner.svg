<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="LuminaBG — Premium AI Background Remover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#15112b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#6d5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect width="1280" height="340" fill="url(#glow2)"/>

  <!-- logo mark -->
  <rect x="80" y="104" width="88" height="88" rx="24" fill="url(#accent)"/>
  <circle cx="124" cy="148" r="21" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95"/>
  <circle cx="124" cy="148" r="7" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="196" y="168" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1">
    <tspan fill="#ffffff">Lumina</tspan><tspan fill="url(#accent)">BG</tspan>
  </text>

  <!-- tagline -->
  <text x="198" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#b9b7cc">
    Remove backgrounds — in your browser, in the cloud, on GPU.
  </text>

  <!-- pills -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#cfcde0">
    <rect x="198" y="240" width="118" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="257" y="265" text-anchor="middle">React 19</text>
    <rect x="328" y="240" width="92" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="374" y="265" text-anchor="middle">Vite 6</text>
    <rect x="432" y="240" width="126" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="495" y="265" text-anchor="middle">ZeroGPU</text>
    <rect x="570" y="240" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="622" y="265" text-anchor="middle">rembg</text>
  </g>

  <!-- accent rule -->
  <rect x="80" y="304" width="1120" height="4" rx="2" fill="url(#rule)"/>
</svg>
